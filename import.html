        // ---------- TMDB (фильмы/сериалы) ----------
        async function fetchTMDB(query, type) {
            const mediaType = type === 'Фильм' ? 'movie' : 'tv';
            const url =
                `https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=ru-RU`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`TMDB HTTP ${resp.status}`);
            const data = await resp.json();
            if (!data.results || !data.results.length) return null;
            return data.results[0];
        }

        // ---------- JIKAN (аниме) ----------
        async function fetchJikan(query) {
            // Сначала пробуем по-русски
            let url =
                `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=1&sfw=true`;
            let resp = await fetch(url);
            if (!resp.ok) throw new Error(`Jikan HTTP ${resp.status}`);
            let data = await resp.json();
            if (data.data && data.data.length) return data.data[0];

            // Если ничего не нашли — пробуем транслит (англ)
            const translit = query
                .replace(/Токийский/g, 'Tokyo')
                .replace(/Магическая/g, 'Jujutsu')
                .replace(/Блюлок/g, 'Blue Lock')
                .replace(/Клинок/g, 'Demon Slayer')
                .replace(/Реинкарнация/g, 'Mushoku Tensei')
                .replace(/Восхождение/g, 'Rising of the Shield Hero')
                .replace(/Хантер/g, 'Hunter x Hunter')
                .replace(/Курокко/g, 'Kuroko no Basket')
                .replace(/Соло/g, 'Solo Leveling')
                .replace(/Повседневная жизнь бессмертного короля/g, 'The Daily Life of the Immortal King')
                .replace(/Берсерк/g, 'Berserk');

            if (translit !== query) {
                const url2 =
                    `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(translit)}&limit=1&sfw=true`;
                const resp2 = await fetch(url2);
                if (!resp2.ok) return null;
                const data2 = await resp2.json();
                if (data2.data && data2.data.length) return data2.data[0];
            }
            return null;
        }

        function buildPoster(path) {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            return `https://image.tmdb.org/t/p/w185${path}`;
        }

        function logMessage(msg, cls = 'info') {
            logEl.innerHTML += `<div class="${cls}">${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateProgress(pct) {
            progressBar.style.width = Math.min(pct, 100) + '%';
        }

        startBtn.addEventListener('click', async function() {
            startBtn.disabled = true;
            startBtn.textContent = '⏳ Идёт импорт...';
            logEl.innerHTML = '';

            const total = myList.length;
            let success = 0;
            let errors = 0;
            const newItems = [];

            for (let i = 0; i < total; i++) {
                const entry = myList[i];
                const pct = ((i + 1) / total) * 100;
                updateProgress(pct);

                const isAnime = entry.type === 'Аниме';
                const source = isAnime ? 'Jikan' : 'TMDB';

                logMessage(`[${i+1}/${total}] Ищу: ${entry.name} (${entry.type} → ${source})`, 'info');

                try {
                    let result = null;
                    let poster = '';
                    let foundName = entry.name;
                    let apiRating = 0;

                    if (isAnime) {
                        result = await fetchJikan(entry.name);
                        if (result) {
                            poster = result.images?.jpg?.image_url || '';
                            foundName = result.title || entry.name;
                            apiRating = result.score ? Math.round(result.score) : 0;
                            logMessage(`✅ Jikan нашёл: ${foundName} (постер: ${poster ? 'есть' : 'нет'})`, 'ok');
                        } else {
                            logMessage(`⚠️ Jikan не нашёл: ${entry.name}`, 'err');
                        }
                    } else {
                        result = await fetchTMDB(entry.name, entry.type);
                        if (result) {
                            poster = buildPoster(result.poster_path);
                            foundName = result.title || result.name || entry.name;
                            apiRating = result.vote_average ? Math.round(result.vote_average * 10) / 10 : 0;
                            logMessage(`✅ TMDB нашёл: ${foundName} (постер: ${poster ? 'есть' : 'нет'})`, 'ok');
                        } else {
                            logMessage(`⚠️ TMDB не нашёл: ${entry.name}`, 'err');
                        }
                    }

                    // Если результат есть — добавляем
                    newItems.push({
                        id: Date.now() + i + Math.random(),
                        name: foundName || entry.name,
                        type: entry.type,
                        status: entry.status,
                        rating: entry.rating || apiRating || 0,
                        rewatches: entry.rewatches || 0,
                        poster: poster || '',
                    });

                    if (result) success++;
                    else errors++;

                } catch (e) {
                    newItems.push({
                        id: Date.now() + i + Math.random(),
                        name: entry.name,
                        type: entry.type,
                        status: entry.status,
                        rating: entry.rating || 0,
                        rewatches: entry.rewatches || 0,
                        poster: '',
                    });
                    errors++;
                    logMessage(`❌ Ошибка: ${entry.name} — ${e.message}`, 'err');
                }

                // Задержка чтобы не превысить лимиты
                await new Promise(r => setTimeout(r, isAnime ? 400 : 250));
            }

            // Сохраняем в localStorage
            localStorage.setItem('myKinoArchive', JSON.stringify(newItems));

            logMessage(`\n🎉 ГОТОВО!`, 'ok');
            logMessage(`✅ Найдено с постерами: ${success}`, 'ok');
            logMessage(`⚠️ Без постера / не найдено: ${errors}`, 'err');
            logMessage(`📦 Всего записей: ${newItems.length}`, 'ok');
            logMessage(`\n👉 Теперь открой свой основной сайт — всё с картинками!`, 'info');

            startBtn.textContent = '✅ Импорт завершён!';
            updateProgress(100);
        });
