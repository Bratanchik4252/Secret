<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Мой киноархив</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            padding: 20px 16px 100px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.10);
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #aaaaaa;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.10);
            color: #ffffff;
        }

        /* STATS */
        .stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            font-size: 14px;
            color: #888888;
        }
        .stats span {
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .stats strong {
            color: #ffffff;
        }

        /* FILTERS */
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filters button {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #888888;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .filters button.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .filters button:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* SEARCH */
        .search-add {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-add input {
            flex: 1;
            min-width: 160px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }
        .search-add input:focus {
            border-color: rgba(255, 255, 255, 0.25);
        }
        .search-add input::placeholder {
            color: #444444;
        }
        .search-add button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        .search-add button:active {
            transform: scale(0.96);
        }

        /* SEARCH RESULTS */
        .search-results {
            margin-bottom: 20px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .search-results.show {
            display: flex;
        }
        .search-result-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .search-result-item:active {
            transform: scale(0.98);
        }
        .search-result-item img {
            width: 44px;
            height: 66px;
            object-fit: cover;
            border-radius: 6px;
            background: #111111;
        }
        .search-result-item .info {
            flex: 1;
        }
        .search-result-item .info .title {
            font-weight: 600;
            font-size: 15px;
        }
        .search-result-item .info .meta {
            font-size: 13px;
            color: #666666;
            margin-top: 2px;
        }
        .search-result-item .add-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        /* CARDS */
        .cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s;
            animation: fadeIn 0.25s ease;
            cursor: pointer;
        }
        .card:active {
            transform: scale(0.98);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card img {
            width: 48px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            background: #111111;
            flex-shrink: 0;
        }
        .card .info {
            flex: 1;
            min-width: 0;
        }
        .card .info .title {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }
        .card .info .meta {
            font-size: 13px;
            color: #666666;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 2px;
        }
        .card .info .meta .badge {
            padding: 0 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            color: #888888;
        }
        .card .info .meta .badge.film {
            background: rgba(52, 152, 219, 0.15);
            color: #5dade2;
        }
        .card .info .meta .badge.serial {
            background: rgba(46, 204, 113, 0.15);
            color: #58d68d;
        }
        .card .info .meta .badge.anime {
            background: rgba(155, 89, 182, 0.15);
            color: #af7ac5;
        }
        .card .info .meta .badge.status {
            background: rgba(255, 255, 255, 0.04);
            color: #666666;
        }
        .card .info .meta .badge.status.watching {
            color: #f1c40f;
        }
        .card .info .meta .badge.status.plan {
            color: #5dade2;
        }
        .card .info .meta .progress-text {
            color: #888888;
            font-size: 12px;
        }
        .card .rating-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }
        .card .rating-circle.high {
            border-color: #2ecc71;
            color: #2ecc71;
        }
        .card .rating-circle.mid {
            border-color: #f1c40f;
            color: #f1c40f;
        }
        .card .rating-circle.low {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .card .rating-circle.zero {
            border-color: #444444;
            color: #444444;
        }
        .card .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            pointer-events: auto;
        }
        .card .actions button {
            background: rgba(255, 255, 255, 0.03);
            border: none;
            color: #555555;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .card .actions button:active {
            transform: scale(0.9);
        }
        .card .actions button.delete:active {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
        }
        .card .actions button.edit:active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        /* EMPTY */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #444444;
        }
        .empty i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.2;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.2s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #ffffff;
        }
        .modal label {
            font-size: 13px;
            color: #666666;
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        .modal input,
        .modal select {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        .modal input:focus,
        .modal select:focus {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .modal input:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            background: transparent;
            color: #ffffff;
        }
        .modal .modal-actions button:active {
            transform: scale(0.96);
        }
        .modal .modal-actions .save-btn {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.10);
        }
        .modal .modal-actions .cancel-btn {
            color: #666666;
        }

        /* DETAIL MODAL */
        .detail-poster {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 16px;
            background: #111111;
        }
        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .detail-meta {
            color: #888888;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .detail-overview {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .detail-similar {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 0 16px;
            scrollbar-width: none;
        }
        .detail-similar::-webkit-scrollbar {
            display: none;
        }
        .detail-similar-item {
            flex: 0 0 80px;
            text-align: center;
            cursor: pointer;
        }
        .detail-similar-item img {
            width: 80px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            background: #111111;
        }
        .detail-similar-item .name {
            font-size: 11px;
            color: #888888;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #111111;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            border-color: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 22px;
            }
            .card {
                padding: 12px 12px;
                gap: 10px;
            }
            .card img {
                width: 40px;
                height: 60px;
            }
            .card .info .title {
                font-size: 14px;
            }
            .search-add input {
                font-size: 14px;
                padding: 10px 14px;
            }
            .search-add button {
                padding: 10px 16px;
                font-size: 14px;
            }
            .detail-similar-item {
                flex: 0 0 60px;
            }
            .detail-similar-item img {
                width: 60px;
                height: 90px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎬 Архив</h1>
            <div class="header-actions">
                <button onclick="exportData()"><i class="fas fa-download"></i></button>
                <button onclick="document.getElementById('importInput').click()"><i class="fas fa-upload"></i></button>
                <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)" />
            </div>
        </div>

        <div class="stats" id="stats">
            <span>📦 <strong id="totalCount">0</strong> всего</span>
            <span>🎬 <strong id="filmCount">0</strong></span>
            <span>📺 <strong id="serialCount">0</strong></span>
            <span>🎌 <strong id="animeCount">0</strong></span>
        </div>

        <div class="filters" id="filters">
            <button class="active" data-filter="all">Все</button>
            <button data-filter="Фильм">🎬 Фильмы</button>
            <button data-filter="Сериал">📺 Сериалы</button>
            <button data-filter="Аниме">🎌 Аниме</button>
        </div>

        <div class="search-add">
            <input type="text" id="searchInput" placeholder="Поиск по названию..." />
            <button onclick="searchTMDB()"><i class="fas fa-search"></i> Найти</button>
        </div>

        <div class="search-results" id="searchResults"></div>
        <div class="cards" id="cards"></div>
        <div class="empty" id="emptyState">
            <i class="fas fa-film"></i>
            <p>Ничего не найдено</p>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3 id="modalTitle">✏️ Редактировать</h3>
            <label>Название</label>
            <input type="text" id="editName" />
            <label>Тип</label>
            <select id="editType">
                <option value="Фильм">🎬 Фильм</option>
                <option value="Сериал">📺 Сериал</option>
                <option value="Аниме">🎌 Аниме</option>
            </select>
            <label>Статус</label>
            <select id="editStatus" onchange="toggleEditFields()">
                <option value="Просмотрено">✅ Просмотрено</option>
                <option value="В процессе">⏳ В процессе</option>
                <option value="Буду смотреть">📌 Буду смотреть</option>
            </select>
            <label>Оценка (1–10)</label>
            <input type="number" id="editRating" min="0" max="10" />
            <label>Пересмотров</label>
            <input type="number" id="editRewatches" min="0" />
            <div id="editProgressWrap" style="display:none;">
                <label>Просмотрено серий</label>
                <input type="number" id="editWatchedEpisodes" min="0" placeholder="0" />
                <label>Всего серий</label>
                <input type="number" id="editTotalEpisodes" min="0" placeholder="0" />
            </div>
            <label>Постер (URL)</label>
            <input type="text" id="editPoster" placeholder="https://image.tmdb.org/..." />
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">Отмена</button>
                <button class="save-btn" onclick="saveEdit()">💾 Сохранить</button>
            </div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <img class="detail-poster" id="detailPoster" src="" alt="" />
            <div class="detail-title" id="detailTitle">—</div>
            <div class="detail-meta" id="detailMeta">—</div>
            <div class="detail-overview" id="detailOverview">Описание отсутствует</div>
            <div style="margin-bottom:8px;color:#888;font-size:13px;">🎬 Похожие фильмы</div>
            <div class="detail-similar" id="detailSimilar"></div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeDetail()" style="width:100%;">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

        // ========================
        //  ЗАГРУЗКА ДАННЫХ
        // ========================
        function loadData() {
            const saved = localStorage.getItem('myKinoArchive');
            if (saved) {
                try {
                    items = JSON.parse(saved);
                    // Добавляем недостающие поля
                    items.forEach(item => {
                        if (item.watchedEpisodes === undefined) item.watchedEpisodes = 0;
                        if (item.totalEpisodes === undefined) item.totalEpisodes = 0;
                    });
                } catch (e) { items = []; }
            }
            if (!items || !items.length) {
                items = MY_BACKUP;
            }
            render();
        }

        function saveData() {
            localStorage.setItem('myKinoArchive', JSON.stringify(items));
            render();
        }

        // ========================
        //  RENDER
        // ========================
        function render() {
            const cardsEl = document.getElementById('cards');
            const emptyEl = document.getElementById('emptyState');
            const searchInput = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = items;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(item => item.type === currentFilter);
            }
            if (searchInput) {
                filtered = filtered.filter(item => item.name.toLowerCase().includes(searchInput));
            }
            filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));

            document.getElementById('totalCount').textContent = items.length;
            document.getElementById('filmCount').textContent = items.filter(i => i.type === 'Фильм').length;
            document.getElementById('serialCount').textContent = items.filter(i => i.type === 'Сериал').length;
            document.getElementById('animeCount').textContent = items.filter(i => i.type === 'Аниме').length;

            if (!filtered.length) {
                cardsEl.innerHTML = '';
                emptyEl.style.display = 'block';
                return;
            }
            emptyEl.style.display = 'none';

            cardsEl.innerHTML = filtered.map(item => {
                const ratingClass = item.rating >= 8 ? 'high' : item.rating >= 5 ? 'mid' : item.rating > 0 ? 'low' :
                    'zero';
                const ratingText = item.rating || '?';
                const posterHtml = item.poster ?
                    `<img src="${item.poster}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'" />` :
                    `<img src="" alt="" style="background:#111111;display:flex;align-items:center;justify-content:center;font-size:20px;color:#444444;" />`;

                const typeBadge = {
                    'Фильм': 'film',
                    'Сериал': 'serial',
                    'Аниме': 'anime'
                } [item.type] || '';

                const statusClass = item.status === 'В процессе' ? 'watching' : item.status === 'Буду смотреть' ? 'plan' :
                    '';

                let progressText = '';
                if ((item.type === 'Сериал' || item.type === 'Аниме') && item.status === 'В процессе') {
                    const watched = item.watchedEpisodes || 0;
                    const total = item.totalEpisodes || '?';
                    progressText = `<span class="progress-text">${watched}/${total} серий</span>`;
                }

                const rewatchText = item.rewatches ? `${item.rewatches} раз` : '';

                return `
                        <div class="card" onclick="openDetail('${item.id}')">
                            ${posterHtml}
                            <div class="info">
                                <div class="title">${item.name}</div>
                                <div class="meta">
                                    <span class="badge ${typeBadge}">${item.type || '?'}</span>
                                    <span class="badge status ${statusClass}">${item.status || 'Просмотрено'}</span>
                                    ${progressText}
                                    ${rewatchText ? `<span style="color:#666;font-size:12px;">🔄 ${rewatchText}</span>` : ''}
                                </div>
                            </div>
                            <div class="rating-circle ${ratingClass}">${ratingText}</div>
                            <div class="actions" onclick="event.stopPropagation();">
                                <button class="edit" onclick="openEdit('${item.id}')"><i class="fas fa-pen"></i></button>
                                <button class="delete" onclick="deleteItem('${item.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        // ========================
        //  CRUD
        // ========================
        function addItem(name, type, status, rating, rewatches, poster, watchedEpisodes, totalEpisodes) {
            items.push({
                id: Date.now() + Math.random(),
                name: name.trim(),
                type: type || 'Фильм',
                status: status || 'Просмотрено',
                rating: parseInt(rating) || 0,
                rewatches: parseInt(rewatches) || 0,
                poster: poster || '',
                watchedEpisodes: parseInt(watchedEpisodes) || 0,
                totalEpisodes: parseInt(totalEpisodes) || 0,
            });
            saveData();
            showToast('✅ Добавлено!');
        }

        function deleteItem(id) {
            if (!confirm('Удалить?')) return;
            items = items.filter(item => item.id != id);
            saveData();
            showToast('🗑️ Удалено');
        }

        function openEdit(id) {
            const item = items.find(i => i.id == id);
            if (!item) return;
            currentEditId = id;
            document.getElementById('editName').value = item.name || '';
            document.getElementById('editType').value = item.type || 'Фильм';
            document.getElementById('editStatus').value = item.status || 'Просмотрено';
            document.getElementById('editRating').value = item.rating || 0;
            document.getElementById('editRewatches').value = item.rewatches || 0;
            document.getElementById('editPoster').value = item.poster || '';
            document.getElementById('editWatchedEpisodes').value = item.watchedEpisodes || 0;
            document.getElementById('editTotalEpisodes').value = item.totalEpisodes || 0;
            document.getElementById('modalTitle').textContent = '✏️ ' + item.name;
            toggleEditFields();
            document.getElementById('editModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('show');
            currentEditId = null;
        }

        function toggleEditFields() {
            const status = document.getElementById('editStatus').value;
            const wrap = document.getElementById('editProgressWrap');
            const ratingInput = document.getElementById('editRating');
            if (status === 'В процессе') {
                wrap.style.display = 'block';
                ratingInput.disabled = true;
                ratingInput.value = 0;
            } else {
                wrap.style.display = 'none';
                ratingInput.disabled = false;
            }
        }

        function saveEdit() {
            const item = items.find(i => i.id == currentEditId);
            if (!item) return;
            item.name = document.getElementById('editName').value.trim() || item.name;
            item.type = document.getElementById('editType').value;
            item.status = document.getElementById('editStatus').value;
            item.rating = parseInt(document.getElementById('editRating').value) || 0;
            item.rewatches = parseInt(document.getElementById('editRewatches').value) || 0;
            item.poster = document.getElementById('editPoster').value.trim() || '';
            item.watchedEpisodes = parseInt(document.getElementById('editWatchedEpisodes').value) || 0;
            item.totalEpisodes = parseInt(document.getElementById('editTotalEpisodes').value) || 0;
            saveData();
            closeModal();
            showToast('💾 Сохранено!');
        }

        // ========================
        //  ПОИСК TMDB
        // ========================
        async function searchTMDB() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                showToast('Введите название для поиска', true);
                return;
            }

            const resultsEl = document.getElementById('searchResults');
            resultsEl.innerHTML = '<div style="color:#666;padding:12px;">⏳ Поиск...</div>';
            resultsEl.classList.add('show');

            try {
                const url =
                    `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=ru-RU`;
                const response = await fetch(url);
                const data = await response.json();

                if (!data.results || !data.results.length) {
                    resultsEl.innerHTML = '<div style="color:#666;padding:12px;">😕 Ничего не найдено</div>';
                    return;
                }

                const results = data.results.slice(0, 8);
                resultsEl.innerHTML = results.map(item => {
                    const title = item.title || item.name || 'Без названия';
                    const year = item.release_date ? item.release_date.slice(0, 4) : item.first_air_date ? item
                        .first_air_date.slice(0, 4) : '';
                    const mediaType = item.media_type === 'movie' ? 'Фильм' : item.media_type === 'tv' ? 'Сериал' :
                        'Фильм';
                    const rating = item.vote_average ? Math.round(item.vote_average * 10) / 10 : '';
                    const poster = item.poster_path ?
                        `https://image.tmdb.org/t/p/w92${item.poster_path}` :
                        '';

                    return `
                            <div class="search-result-item" onclick="addFromSearch('${title}', '${mediaType}', '${rating}', '${poster}')">
                                ${poster ? `<img src="${poster}" alt="${title}" />` : '<div style="width:44px;height:66px;background:#111111;border-radius:6px;flex-shrink:0;"></div>'}
                                <div class="info">
                                    <div class="title">${title}</div>
                                    <div class="meta">${mediaType} ${year ? '· ' + year : ''} ${rating ? '⭐ ' + rating : ''}</div>
                                </div>
                                <button class="add-btn"><i class="fas fa-plus"></i></button>
                            </div>
                        `;
                }).join('');

            } catch (e) {
                resultsEl.innerHTML = '<div style="color:#e74c3c;padding:12px;">❌ Ошибка запроса. Проверь интернет.</div>';
                console.error(e);
            }
        }

        function addFromSearch(name, type, rating, poster) {
            addItem(name, type, 'Просмотрено', rating || 0, 0, poster, 0, 0);
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('searchInput').value = '';
        }

        // ========================
        //  ФИЛЬТРЫ
        // ========================
        document.getElementById('filters').addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (!btn) return;
            document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            render();
        });

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const val = this.value.trim();
                if (!val) {
                    document.getElementById('searchResults').classList.remove('show');
                }
                render();
            }, 200);
        });
        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') searchTMDB();
        });

        // ========================
        //  ДЕТАЛЬНАЯ СТРАНИЦА
        // ========================
        async function openDetail(id) {
            const item = items.find(i => i.id == id);
            if (!item) return;

            detailItemId = id;
            const modal = document.getElementById('detailModal');
            const poster = document.getElementById('detailPoster');
            const title = document.getElementById('detailTitle');
            const meta = document.getElementById('detailMeta');
            const overview = document.getElementById('detailOverview');
            const similar = document.getElementById('detailSimilar');

            poster.src = item.poster || '';
            poster.alt = item.name;
            title.textContent = item.name;
            meta.textContent = `${item.type} · ${item.status} · Твоя оценка: ${item.rating || 'нет'} ⭐`;
            overview.textContent = '⏳ Загрузка описания...';
            similar.innerHTML = '<div style="color:#666;padding:8px;">Загрузка похожих...</div>';

            modal.classList.add('show');

            // Загружаем данные из TMDB
            try {
                const url =
                    `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(item.name)}&language=ru-RU`;
                const resp = await fetch(url);
                const data = await resp.json();

                if (data.results && data.results.length) {
                    const first = data.results[0];
                    const desc = first.overview || 'Описание отсутствует';
                    overview.textContent = desc;

                    // Похожие
                    const similarUrl =
                        `https://api.themoviedb.org/3/${first.media_type === 'movie' ? 'movie' : 'tv'}/${first.id}/similar?api_key=${TMDB_API_KEY}&language=ru-RU`;
                    const similarResp = await fetch(similarUrl);
                    const similarData = await similarResp.json();

                    if (similarData.results && similarData.results.length) {
                        similar.innerHTML = similarData.results.slice(0, 10).map(s => {
                            const posterPath = s.poster_path ?
                                `https://image.tmdb.org/t/p/w92${s.poster_path}` :
                                '';
                            const name = s.title || s.name || '—';
                            return `
                                    <div class="detail-similar-item" onclick="openDetailByName('${name}')">
                                        ${posterPath ? `<img src="${posterPath}" alt="${name}" />` : '<div style="width:80px;height:120px;background:#111111;border-radius:8px;"></div>'}
                                        <div class="name">${name}</div>
                                    </div>
                                `;
                        }).join('');
                    } else {
                        similar.innerHTML = '<div style="color:#666;padding:8px;">Похожих не найдено</div>';
                    }
                } else {
                    overview.textContent = 'Описание не найдено';
                    similar.innerHTML = '<div style="color:#666;padding:8px;">Похожих не найдено</div>';
                }
            } catch (e) {
                overview.textContent = '❌ Ошибка загрузки описания';
                similar.innerHTML = '<div style="color:#666;padding:8px;">Ошибка загрузки</div>';
            }
        }

        async function openDetailByName(name) {
            const item = items.find(i => i.name.toLowerCase() === name.toLowerCase());
            if (item) {
                openDetail(item.id);
            } else {
                // Ищем в TMDB и добавляем временно
                showToast('🔍 Ищем...', false);
                try {
                    const url =
                        `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(name)}&language=ru-RU`;
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.results && data.results.length) {
                        const first = data.results[0];
                        const title = first.title || first.name || name;
                        const type = first.media_type === 'movie' ? 'Фильм' : first.media_type === 'tv' ? 'Сериал' :
                            'Фильм';
                        const poster = first.poster_path ? `https://image.tmdb.org/t/p/w185${first.poster_path}` : '';
                        const rating = first.vote_average ? Math.round(first.vote_average * 10) / 10 : 0;
                        // Добавляем в список
                        addItem(title, type, 'Буду смотреть', rating, 0, poster, 0, 0);
                        // Открываем детали
                        const newItem = items[items.length - 1];
                        openDetail(newItem.id);
                    } else {
                        showToast('❌ Не найден', true);
                    }
                } catch (e) {
                    showToast('❌ Ошибка', true);
                }
            }
        }

        function closeDetail() {
            document.getElementById('detailModal').classList.remove('show');
        }

        // ========================
        //  ЭКСПОРТ / ИМПОРТ
        // ========================
        function exportData() {
            const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'my_archive_backup.json';
            a.click();
            showToast('📦 Бэкап скачан!');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data) && data.length) {
                        data.forEach(item => {
                            if (item.watchedEpisodes === undefined) item.watchedEpisodes = 0;
                            if (item.totalEpisodes === undefined) item.totalEpisodes = 0;
                        });
                        items = data;
                        saveData();
                        showToast('✅ Импорт успешен!');
                    } else {
                        showToast('❌ Неверный формат', true);
                    }
                } catch (err) {
                    showToast('❌ Ошибка чтения файла', true);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ========================
        //  TOAST
        // ========================
        let toastTimeout;

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ========================
        //  ЗАПУСК
        // ========================
        loadData();

        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetail();
        });

        console.log('🎬 Мой киноархив загружен!');
        console.log('📦 Всего записей:', items.length);
        console.log('👆 Кликни на любую карточку для деталей');
    </script>

</body>
</html>
