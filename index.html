<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мой киноархив</title>
    <meta name="description" content="Личный архив фильмов, сериалов и аниме" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-clapperboard"></i></div>
                <span class="logo-text">Киноархив</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="importBtn" title="Импорт"><i class="fas fa-upload"></i></button>
                <button class="icon-btn" id="exportBtn" title="Экспорт (бэкап)"><i class="fas fa-download"></i></button>
                <input type="file" id="importInput" accept=".json" style="display:none" />
            </div>
        </div>
    </header>

    <main class="container">

        <!-- СТАТИСТИКА -->
        <div class="stats">
            <div class="stat total">
                <div class="num" id="totalCount">0</div>
                <div class="lbl">Всего</div>
            </div>
            <div class="stat film">
                <div class="num" id="filmCount">0</div>
                <div class="lbl">Фильмы</div>
            </div>
            <div class="stat serial">
                <div class="num" id="serialCount">0</div>
                <div class="lbl">Сериалы</div>
            </div>
            <div class="stat anime">
                <div class="num" id="animeCount">0</div>
                <div class="lbl">Аниме</div>
            </div>
            <div class="stat avg">
                <div class="num" id="avgRating">—</div>
                <div class="lbl">Средняя</div>
            </div>
        </div>

        <!-- УПРАВЛЕНИЕ -->
        <div class="controls">
            <div class="filters-row" id="typeFilters">
                <button class="chip active" data-filter="all">Все</button>
                <button class="chip" data-filter="Фильм">🎬 Фильмы</button>
                <button class="chip" data-filter="Сериал">📺 Сериалы</button>
                <button class="chip" data-filter="Аниме">🎌 Аниме</button>
            </div>

            <div class="filters-row" id="statusFilters">
                <button class="chip active" data-status="all">Все статусы</button>
                <button class="chip status-watching" data-status="В процессе">⏳ В процессе</button>
                <button class="chip status-plan" data-status="Буду смотреть">📌 Буду смотреть</button>
            </div>

            <div class="toolbar">
                <select class="sort-select" id="sortSelect">
                    <option value="rating-desc">⭐ По рейтингу ↓</option>
                    <option value="rating-asc">⭐ По рейтингу ↑</option>
                    <option value="name-asc">🔤 По названию А–Я</option>
                    <option value="name-desc">🔤 По названию Я–А</option>
                    <option value="id-desc">🆕 Сначала новые</option>
                    <option value="id-asc">📅 Сначала старые</option>
                </select>
                <div class="view-toggle">
                    <button id="viewGrid" class="active" title="Сетка"><i class="fas fa-th-large"></i></button>
                    <button id="viewList" title="Список"><i class="fas fa-list"></i></button>
                </div>
            </div>
        </div>

        <!-- ПОИСК -->
        <div class="search-add">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск по названию или добавь новое..." />
            </div>
            <button class="search-btn" id="searchBtn"><i class="fas fa-plus"></i> Найти</button>
        </div>

        <div class="search-results" id="searchResults"></div>

        <!-- КАРТОЧКИ -->
        <div class="cards" id="cards"></div>

        <div class="empty" id="emptyState" style="display:none;">
            <div class="empty-icon"><i class="fas fa-film"></i></div>
            <p>Ничего не найдено</p>
            <p class="empty-sub">Попробуй изменить фильтры или поисковый запрос</p>
        </div>

    </main>

    <!-- FAB -->
    <button class="fab" id="fabAdd" title="Добавить"><i class="fas fa-plus"></i></button>

    <!-- МОДАЛКА ДОБАВЛЕНИЯ / РЕДАКТИРОВАНИЯ -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="modalTitle">✏️ Редактировать</h3>
                <button class="modal-close" id="modalCloseBtn"><i class="fas fa-xmark"></i></button>
            </div>
            <label>Название</label>
            <input type="text" id="editName" placeholder="Например: Властелин колец" />
            <div class="form-row">
                <div>
                    <label>Тип</label>
                    <select id="editType">
                        <option value="Фильм">🎬 Фильм</option>
                        <option value="Сериал">📺 Сериал</option>
                        <option value="Аниме">🎌 Аниме</option>
                    </select>
                </div>
                <div>
                    <label>Статус</label>
                    <select id="editStatus" onchange="toggleEditFields()">
                        <option value="Просмотрено">✅ Просмотрено</option>
                        <option value="В процессе">⏳ В процессе</option>
                        <option value="Буду смотреть">📌 Буду смотреть</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>Оценка (1–10)</label>
                    <input type="number" id="editRating" min="0" max="10" placeholder="—" />
                </div>
                <div>
                    <label>Пересмотров</label>
                    <input type="number" id="editRewatches" min="0" value="0" />
                </div>
            </div>
            <div id="editProgressWrap" style="display:none;">
                <div class="form-row">
                    <div>
                        <label>Просмотрено серий</label>
                        <input type="number" id="editWatchedEpisodes" min="0" placeholder="0" />
                    </div>
                    <div>
                        <label>Всего серий</label>
                        <input type="number" id="editTotalEpisodes" min="0" placeholder="0" />
                    </div>
                </div>
            </div>
            <label>Постер (URL)</label>
            <input type="text" id="editPoster" placeholder="https://image.tmdb.org/..." />
            <div class="modal-actions">
                <button class="btn-ghost" id="cancelModalBtn">Отмена</button>
                <button class="btn-primary" id="saveModalBtn">💾 Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ДЕТАЛЬНАЯ МОДАЛКА -->
    <div class="modal-overlay detail-modal" id="detailModal">
        <div class="modal">
            <div class="detail-hero">
                <img id="detailPoster" src="" alt="" />
                <div class="hero-fallback" id="detailHeroFallback" style="display:none;"><i class="fas fa-film"></i><span>Без постера</span></div>
                <div class="shade"></div>
                <button class="detail-close" id="detailCloseBtn"><i class="fas fa-xmark"></i></button>
                <div class="detail-hero-info">
                    <div class="detail-title" id="detailTitle">—</div>
                    <div class="detail-meta">
                        <span class="badge film" id="detailType">—</span>
                        <span class="badge status-watched" id="detailStatus">—</span>
                        <span id="detailYear">—</span>
                    </div>
                </div>
            </div>
            <div class="detail-body">
                <div class="detail-info-line">
                    <div class="dil-item">
                        <div class="dil-val" id="detailRating">—</div>
                        <div class="dil-lbl">Оценка</div>
                    </div>
                    <div class="dil-item">
                        <div class="dil-val" id="detailRewatches">0</div>
                        <div class="dil-lbl">Пересмотры</div>
                    </div>
                    <div class="dil-item">
                        <div class="dil-val" id="detailYear2">—</div>
                        <div class="dil-lbl">Год</div>
                    </div>
                </div>
                <div class="detail-overview" id="detailOverview">Описание отсутствует</div>
                <div class="detail-section-title">Жанры</div>
                <div class="detail-genres" id="detailGenres"></div>
                <div class="detail-section-title">Похожее</div>
                <div class="detail-similar" id="detailSimilar"></div>
                <div class="modal-actions">
                    <button class="btn-ghost" onclick="closeDetail()" style="width:100%;">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПОДТВЕРЖДЕНИЯ -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal" style="max-width:360px;">
            <div class="modal-head">
                <h3>🗑️ Подтверждение</h3>
                <button class="modal-close" onclick="closeConfirm()"><i class="fas fa-xmark"></i></button>
            </div>
            <p id="confirmText" style="color:#b9b9c3;font-size:15px;line-height:1.5;"></p>
            <div class="modal-actions">
                <button class="btn-ghost" id="confirmNo">Отмена</button>
                <button class="btn-danger" id="confirmYes">Удалить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
